<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابَع</title>
<meta name="description" content="منشورات الصفحات المختارة فقط، بلا اقتراحات ولا ضجيج">
<meta name="theme-color" content="#1f5fc4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متابَع">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* تخطيط: شريط علوي ثابت، صف رقائق للتصفية، وعمود واحد للخلاصات المضمّنة */
:root{
  --bg:#eef2f8; --surface:#ffffff; --fg:#141b27; --muted:#59647a; --line:#d4dcea;
  --accent:#1f5fc4; --accent-soft:#dfe9fa; --warn-bg:#fff4dc; --warn-fg:#7a5300; --danger:#b3323f;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#161d2a; --fg:#e5ebf4; --muted:#8e9ab0; --line:#253044;
  --accent:#6fa4ff; --accent-soft:#1b2c4a; --warn-bg:#3a2f15; --warn-fg:#f2cf7c; --danger:#ef7381; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.7}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent);margin-inline-end:auto;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;padding:4px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:16px 40px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card-h b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:12px;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 10px}
.embed{display:flex;justify-content:center;background:var(--surface)}
.embed iframe{border:0;display:block;max-width:100%}
.lnk{color:var(--accent);font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap}
.group-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.group-body p{margin:0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;font:inherit;font-weight:600;padding:8px 18px;border-radius:999px;cursor:pointer;background:var(--accent);color:var(--surface);text-decoration:none}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:4px 12px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.notice{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 14px;font-size:14px}
.empty{text-align:center;padding:40px 16px}
.empty h2{font-family:var(--display);font-weight:500;margin:0 0 6px}
.empty p{color:var(--muted);margin:0 0 14px}
.sm-x{width:30px;height:30px;font-size:14px}
.icon-btn{border:0;background:var(--bg);color:var(--muted);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;font-size:18px;text-decoration:none}
/* الإدارة */
.admin h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0}
.admin h3{font-size:15px;margin:0 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
input[type=url]{direction:ltr;text-align:left}
textarea{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:160px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--danger);font-size:13px;min-height:1em}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600}
.item .t span{display:block;font-size:12px;color:var(--muted);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{margin:0;padding-inline-start:20px;font-size:14px;color:var(--muted)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;z-index:20}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="logo">متابَع <small>صفحاتك فقط</small></div>
    <a class="btn sm" id="adminLink" href="#admin">+ إضافة صفحة</a>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="تصفية"></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script>
const DEFAULT_LIST={"title":"متابَع","items":[]};
const LS_KEY="mutaba-local";
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let base=DEFAULT_LIST, local={added:[],hidden:[]}, list=DEFAULT_LIST, filter="all", lastW=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function normUrl(u){
  u=(u||"").trim().replace(/\s+/g,""); if(!u)return null;
  if(/^@?[A-Za-z0-9._-]{2,}$/.test(u)&&!/facebook|fb\.com/i.test(u))return "https://www.facebook.com/"+u.replace(/^@/,"");
  if(!/^https?:\/\//i.test(u))u="https://"+u;
  let x; try{x=new URL(u)}catch(e){return null}
  const h=x.hostname.replace(/^(www|m|web|mbasic)\./,"");
  if(!["facebook.com","fb.com"].includes(h))return null;
  if(x.pathname==="/profile.php"&&x.searchParams.get("id"))return "https://www.facebook.com/profile.php?id="+x.searchParams.get("id");
  const path=x.pathname.replace(/\/+$/,""); if(!path||path==="/")return null;
  if(/^\/(share|sharer|watch|reel|photo|story)/.test(path))return "share";
  return "https://www.facebook.com"+path;
}
const isGroup=u=>/facebook\.com\/groups\//.test(u);

function combine(){
  const hidden=new Set(local.hidden);
  const items=base.items.filter(i=>!hidden.has(i.url)).map(i=>({...i,mine:false}));
  local.added.forEach(i=>{if(!items.some(x=>x.url===i.url))items.push({...i,mine:true})});
  list={title:base.title||"متابَع",items};
}
function saveLocal(){store.set(LS_KEY,local);combine()}
async function load(){
  const l=store.get(LS_KEY); if(l&&Array.isArray(l.added))local={added:l.added,hidden:Array.isArray(l.hidden)?l.hidden:[]};
  try{
    const r=await fetch("pages.json",{cache:"no-store"});
    if(r.ok){const j=await r.json();if(Array.isArray(j.items))base=j}
  }catch(e){}
  combine();
}

function embedWidth(){const w=$("#view").clientWidth-2;return Math.max(180,Math.min(500,Math.floor(w)))}
function iframe(url,h){
  const w=embedWidth();
  const src="https://www.facebook.com/plugins/page.php?href="+encodeURIComponent(url)+"&tabs=timeline&width="+w+"&height="+h+"&small_header=true&adapt_container_width=true&hide_cover=false&show_facepile=false&hide_cta=true&locale=ar_AR";
  return `<iframe src="${esc(src)}" width="${w}" height="${h}" loading="lazy" scrolling="yes" allow="encrypted-media; clipboard-write" title="منشورات الصفحة"></iframe>`;
}

function renderChips(){
  const pages=list.items.filter(i=>i.type!=="group"), groups=list.items.filter(i=>i.type==="group");
  let h=`<button class="chip" aria-pressed="${filter==="all"}" data-f="all">الكل</button>`;
  pages.forEach((p,i)=>h+=`<button class="chip" aria-pressed="${filter==="p"+i}" data-f="p${i}">${esc(p.name)}</button>`);
  if(groups.length)h+=`<button class="chip" aria-pressed="${filter==="groups"}" data-f="groups">المجموعات (${groups.length})</button>`;
  $("#chips").innerHTML=h;
}

function pageCard(p,h){
  return `<article class="card"><div class="card-h"><b>${esc(p.name)}</b><span class="kind">صفحة</span><a class="lnk" href="${esc(p.url)}" target="_blank" rel="noopener">فتح ↗</a><button class="icon-btn sm-x" data-del="${esc(p.url)}" aria-label="حذف ${esc(p.name)}" title="حذف">✕</button></div><div class="embed">${iframe(p.url,h)}</div></article>`;
}
function groupCard(g){
  return `<article class="card"><div class="card-h"><b>${esc(g.name)}</b><span class="kind">مجموعة</span><button class="icon-btn sm-x" data-del="${esc(g.url)}" aria-label="حذف ${esc(g.name)}" title="حذف">✕</button></div>
  <div class="group-body"><p>فيسبوك لا يسمح بعرض منشورات المجموعات خارج موقعه، فتُفتح المجموعة مباشرة في فيسبوك.</p>
  <a class="btn ghost" href="${esc(g.url)}" target="_blank" rel="noopener">افتح المجموعة ↗</a></div></article>`;
}

function renderFeed(){
  document.title=list.title||"متابَع";
  renderChips();
  const pages=list.items.filter(i=>i.type!=="group"), groups=list.items.filter(i=>i.type==="group");
  let h="";
  if(!list.items.length){
    $("#view").innerHTML=h+`<div class="empty"><h2>لا توجد صفحات بعد</h2><p>أضف روابط صفحات فيسبوك من شاشة الإدارة.</p><a class="btn" href="#admin">إضافة صفحات</a></div>`;return;
  }
  if(filter==="groups") h+=groups.map(groupCard).join("");
  else if(filter.startsWith("p")&&pages[+filter.slice(1)]) h+=pageCard(pages[+filter.slice(1)],1400);
  else{filter="all";h+=pages.map(p=>pageCard(p,700)).join("")+groups.map(groupCard).join("");}
  $("#view").innerHTML=`<div class="stack">${h}</div>`;
  lastW=embedWidth();
}

/* ===== الإدارة ===== */
function renderAdmin(){
  $("#chips").innerHTML=`<a class="chip" href="#" style="text-decoration:none">→ رجوع للخلاصة</a>`;
  const items=list.items.map((it,i)=>`<div class="item"><div class="t"><b>${esc(it.name)} <span class="kind">${it.type==="group"?"مجموعة":"صفحة"}</span></b><span>${esc(it.url)}</span></div>
    <button class="btn danger sm" data-del="${esc(it.url)}">حذف</button></div>`).join("")||`<p style="color:var(--muted);margin:0">القائمة فارغة.</p>`;
  const exportList={title:list.title,items:list.items.map(({name,url,type})=>({name,url,type}))};
  $("#view").innerHTML=`<div class="stack admin">
  <h2>إدارة الصفحات</h2>
  <div class="panel">
    <h3>إضافة صفحة أو مجموعة</h3>
    <button class="btn" id="pasteBtn" type="button">${PASTE_LABEL}</button>
    <p style="margin:0;font-size:13px;color:var(--muted)">في فيسبوك: افتح الصفحة ← ⋯ ← «نسخ الرابط»، ثم ارجع واضغط الزر. أو اكتب الرابط يدوياً:</p>
    <label for="fUrl">رابط الصفحة أو اسم المستخدم فقط<input type="url" id="fUrl" placeholder="مثال: Chlef.people" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label for="fName">الاسم الذي يظهر في المنصة<input id="fName" placeholder="مثال: بلدية مستغانم"></label>
    <div class="err" id="fErr"></div>
    <div class="row"><button class="btn ghost" id="addBtn">إضافة</button></div>
  </div>
  <div class="panel"><h3>صفحاتك (${list.items.length})</h3>${items}</div>
  <details class="panel">
    <summary style="cursor:pointer;font-weight:600">نشر هذه القائمة لكل المستخدمين</summary>
    <p style="margin:0;font-size:14px;color:var(--muted)">الصفحات التي تضيفها هنا تُحفظ على هذا الجهاز. لتظهر عند كل من ثبّت التطبيق، انسخ النص وضعه مكان محتوى ملف docs/pages.json في GitHub.</p>
    <textarea id="json" readonly aria-label="محتوى ملف pages.json">${esc(JSON.stringify(exportList,null,2))}</textarea>
    <div class="row"><button class="btn ghost" id="copyBtn">نسخ النص</button></div>
  </details></div>`;
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.f){filter=b.dataset.f;renderFeed();window.scrollTo({top:0});return}
  if(b.id==="pasteBtn"){
    $("#fErr").textContent="";
    if(window.MutabaApp&&window.MutabaApp.pasteFromClipboard){b.disabled=true;b.textContent="جارٍ قراءة الرابط…";window.MutabaApp.pasteFromClipboard();return}
    try{const t=await navigator.clipboard.readText();addResolved(t,"")}catch(err){$("#fErr").textContent="المتصفح لا يسمح بالقراءة من الحافظة. الصق الرابط في الخانة أدناه بالضغط المطوّل.";$("#fUrl").focus()}
    return}
  if(b.id==="addBtn"){
    const url=normUrl($("#fUrl").value), name=$("#fName").value.trim();
    if(url==="share"&&window.MutabaApp&&window.MutabaApp.resolveText){$("#fErr").textContent="جارٍ قراءة الرابط…";window.MutabaApp.resolveText($("#fUrl").value);return}
    if(url==="share"){$("#fErr").textContent="هذا رابط مشاركة وليس رابط الصفحة. افتح الصفحة في فيسبوك واضغط على اسمها، ثم انسخ الرابط من شريط العنوان، مثل facebook.com/NASA";return}
    if(!url){$("#fErr").textContent="الرابط غير صالح. انسخ رابط الصفحة من فيسبوك، مثل facebook.com/NASA";return}
    if(list.items.some(i=>i.url===url)){$("#fErr").textContent="هذه الصفحة موجودة في القائمة.";return}
    local.hidden=local.hidden.filter(u=>u!==url);
    if(!base.items.some(i=>i.url===url))local.added.push({name:name||decodeURIComponent(url.split("/").pop()),url,type:isGroup(url)?"group":"page"});
    saveLocal();filter="all";location.hash="";toast("أُضيفت الصفحة");return}
  if(b.dataset.del!=null){const u=b.dataset.del;
    if(local.added.some(i=>i.url===u))local.added=local.added.filter(i=>i.url!==u);
    else if(!local.hidden.includes(u))local.hidden.push(u);
    saveLocal();location.hash==="#admin"?renderAdmin():renderFeed();toast("حُذفت");return}
  if(b.id==="copyBtn"){const t=$("#json");try{await navigator.clipboard.writeText(t.value);toast("نُسخ النص")}catch(err){t.focus();t.select();toast("حدّد النص وانسخه يدوياً")}return}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="fUrl"||e.target.id==="fName")){e.preventDefault();$("#addBtn").click()}});

function route(){if(location.hash==="#admin")renderAdmin();else renderFeed()}
function addResolved(raw,givenName){
  const url=normUrl(raw);
  if(!url||url==="share"){
    if(location.hash!=="#admin")location.hash="#admin";
    setTimeout(()=>{const er=$("#fErr");if(er)er.textContent=url==="share"
      ?"فيسبوك لم يكشف رابط الصفحة. افتح «حول» في الصفحة واكتب اسم المستخدم الخاص بها، مثل Chlef.people"
      :"لم أجد رابط صفحة فيسبوك في ما نسخته. انسخ رابط الصفحة ثم اضغط «لصق» مرة أخرى.";},60);
    return false;
  }
  if(list.items.some(i=>i.url===url)){toast("الصفحة موجودة مسبقاً");return false}
  local.hidden=local.hidden.filter(u=>u!==url);
  const name=(givenName||"").trim()||decodeURIComponent(url.split(/[\/=]/).pop());
  if(!base.items.some(i=>i.url===url))local.added.push({name,url,type:isGroup(url)?"group":"page"});
  saveLocal(); filter="all";
  if(location.hash)location.hash=""; else renderFeed();
  toast("أُضيفت: "+name); return true;
}
window.nativeAdd=(url,name)=>{const b=$("#pasteBtn");if(b){b.disabled=false;b.textContent=PASTE_LABEL}addResolved(url,name)};
const PASTE_LABEL="📋 لصق رابط منسوخ من فيسبوك";
function addFromShare(){
  let q; try{q=new URLSearchParams(location.search)}catch(e){return}
  const raw=q.get("add"); if(!raw)return;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  addResolved(raw,q.get("name"));
}
window.addEventListener("hashchange",route);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(location.hash!=="#admin"&&Math.abs(embedWidth()-lastW)>40)renderFeed()},300)});
load().then(()=>{addFromShare();if(location.hash==="#added")history.replaceState(null,"",location.pathname);route()});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
